services:
  - type: web
    name: telegram-media-saver
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      # Необязательно: ключ RapidAPI (YouTube Media Downloader) — запасной путь для YouTube.
      - key: RAPIDAPI_KEY
        sync: false
